<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TradingView paper signal validator workflow</title>
  <desc id="desc">A local webhook passes a synthetic payload to a strict paper-only validator and returns a validation result without any downstream request.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#13263a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <text x="56" y="58" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">TradingView paper signal validator</text>
  <text x="56" y="88" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">Local demo · inactive export · no PipSync or broker call</text>
  <g filter="url(#shadow)">
    <rect x="70" y="145" width="270" height="145" rx="18" fill="#152238" stroke="#334155"/>
    <circle cx="106" cy="181" r="14" fill="#2dd4bf"/>
    <text x="132" y="188" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="650">Local webhook</text>
    <text x="102" y="224" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="15">POST synthetic JSON</text>
    <text x="102" y="250" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">No authentication claim</text>
  </g>
  <path d="M 350 217 H 452" fill="none" stroke="#5eead4" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="470" y="125" width="300" height="185" rx="18" fill="#152238" stroke="#2dd4bf" stroke-width="2"/>
    <text x="506" y="171" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="650">Strict validator</text>
    <text x="506" y="205" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="15">✓ paper / sandbox only</text>
    <text x="506" y="233" fill="#fda4af" font-family="Inter, system-ui, sans-serif" font-size="15">× live rejected</text>
    <text x="506" y="261" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="15">✓ bounded fields + geometry</text>
    <text x="506" y="289" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">Execution always disabled</text>
  </g>
  <path d="M 780 217 H 882" fill="none" stroke="#5eead4" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="900" y="145" width="230" height="145" rx="18" fill="#152238" stroke="#334155"/>
    <text x="936" y="188" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="650">JSON result</text>
    <text x="936" y="224" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="15">200 accepted</text>
    <text x="936" y="250" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="15">400 / 403 rejected</text>
  </g>
  <rect x="70" y="344" width="1060" height="40" rx="12" fill="#0f2f35" stroke="#155e75"/>
  <text x="600" y="370" text-anchor="middle" fill="#99f6e4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">No durable idempotency · no replay receipt · no downstream side effect</text>
</svg>
