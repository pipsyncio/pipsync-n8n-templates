<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Read-only PipSync signals to chat workflow</title>
  <desc id="desc">A manual trigger selects synthetic data by default or an explicitly enabled read-only signals request, builds a redacted summary, and offers disabled Slack and Telegram outputs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#13263a"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020617" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#background)"/>
  <text x="56" y="56" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">Read-only signals → redacted chat summary</text>
  <text x="56" y="86" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">Synthetic branch is the default; every external node ships disabled</text>
  <g filter="url(#shadow)"><rect x="55" y="205" width="180" height="90" rx="16" fill="#152238" stroke="#334155"/><text x="145" y="240" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Manual run</text><text x="145" y="268" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">inactive workflow</text></g>
  <path d="M 245 250 H 315" stroke="#5eead4" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="330" y="185" width="220" height="130" rx="16" fill="#152238" stroke="#2dd4bf"/><text x="440" y="225" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Safe configuration</text><text x="440" y="257" text-anchor="middle" fill="#99f6e4" font-family="Inter, system-ui, sans-serif" font-size="14">useSyntheticData = true</text><text x="440" y="283" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">limit = 10</text></g>
  <path d="M 560 250 H 620 V 155 H 685" stroke="#5eead4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 620 250 V 350 H 685" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="700" y="105" width="235" height="105" rx="16" fill="#12332f" stroke="#2dd4bf"/><text x="817" y="147" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Synthetic fixture</text><text x="817" y="178" text-anchor="middle" fill="#99f6e4" font-family="Inter, system-ui, sans-serif" font-size="14">runs by default</text></g>
  <g filter="url(#shadow)"><rect x="700" y="300" width="235" height="105" rx="16" fill="#2b2233" stroke="#fb7185"/><text x="817" y="342" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">GET /signals</text><text x="817" y="373" text-anchor="middle" fill="#fda4af" font-family="Inter, system-ui, sans-serif" font-size="14">disabled + credential-free</text></g>
  <path d="M 945 157 H 1005 V 235" stroke="#5eead4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 945 352 H 1005 V 265" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1020" y="190" width="145" height="120" rx="16" fill="#152238" stroke="#2dd4bf"/><text x="1092" y="231" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650">Redact</text><text x="1092" y="259" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="13">IDs · prices</text><text x="1092" y="283" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="13">channels · providers</text></g>
  <rect x="330" y="435" width="605" height="38" rx="11" fill="#0f2f35" stroke="#155e75"/>
  <text x="632" y="460" text-anchor="middle" fill="#99f6e4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Slack and Telegram outputs remain disabled until a user configures exactly one</text>
</svg>
