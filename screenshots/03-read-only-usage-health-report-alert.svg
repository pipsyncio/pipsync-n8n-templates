<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Read-only usage health and report alert workflow</title>
  <desc id="desc">An inactive six-hour schedule uses synthetic data by default. Optional disabled GET requests fetch health, account usage, and the report catalog, then a threshold evaluator creates a redacted preview for disabled chat outputs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#13263a"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020617" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#background)"/>
  <text x="56" y="56" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">Read-only health, usage, and report monitor</text>
  <text x="56" y="86" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">Six-hour schedule remains inactive until manual verification</text>
  <g filter="url(#shadow)"><rect x="50" y="220" width="180" height="100" rx="16" fill="#152238" stroke="#334155"/><text x="140" y="260" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Schedule</text><text x="140" y="290" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">inactive · 6 hours</text></g>
  <path d="M 240 270 H 300" stroke="#5eead4" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="315" y="200" width="210" height="140" rx="16" fill="#152238" stroke="#2dd4bf"/><text x="420" y="242" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Configuration</text><text x="420" y="273" text-anchor="middle" fill="#99f6e4" font-family="Inter, system-ui, sans-serif" font-size="14">synthetic = true</text><text x="420" y="301" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14">warning = 80%</text></g>
  <path d="M 535 270 H 590 V 145 H 650" stroke="#5eead4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 590 270 V 325 H 650" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="665" y="105" width="250" height="95" rx="16" fill="#12332f" stroke="#2dd4bf"/><text x="790" y="145" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Synthetic responses</text><text x="790" y="174" text-anchor="middle" fill="#99f6e4" font-family="Inter, system-ui, sans-serif" font-size="14">safe default</text></g>
  <g filter="url(#shadow)"><rect x="665" y="235" width="250" height="185" rx="16" fill="#2b2233" stroke="#fb7185"/><text x="790" y="274" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Disabled GET nodes</text><text x="790" y="310" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14">/health</text><text x="790" y="340" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14">/account/usage</text><text x="790" y="370" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14">/reports</text><text x="790" y="399" text-anchor="middle" fill="#fda4af" font-family="Inter, system-ui, sans-serif" font-size="13">Header Auth stored outside export</text></g>
  <path d="M 925 152 H 980 V 242" stroke="#5eead4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 925 328 H 980 V 290" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="995" y="205" width="165" height="130" rx="16" fill="#152238" stroke="#2dd4bf"/><text x="1077" y="246" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650">Evaluate</text><text x="1077" y="275" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="13">threshold</text><text x="1077" y="299" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="13">redaction</text></g>
  <rect x="315" y="475" width="845" height="42" rx="12" fill="#0f2f35" stroke="#155e75"/>
  <text x="737" y="502" text-anchor="middle" fill="#99f6e4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Preview first · enable one chat destination · activate schedule last</text>
</svg>
